<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои финансы</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финансы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3b6cf6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{
  --bg:#f5f5f7;--card:#ffffff;--text:#1c1c1e;--muted:#8a8a8e;--line:#e5e5ea;
  --inc:#1f9d55;--exp:#e5484d;--accent:#3b6cf6;--accent-t:#ffffff;--chip:#eef0f5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e0e10;--card:#1c1c1f;--text:#f2f2f5;--muted:#8e8e93;--line:#2c2c30;--inc:#3ecf7b;--exp:#ff6369;--accent:#6c8cff;--accent-t:#0e0e10;--chip:#2a2a2e}
}
:root[data-theme="dark"]{--bg:#0e0e10;--card:#1c1c1f;--text:#f2f2f5;--muted:#8e8e93;--line:#2c2c30;--inc:#3ecf7b;--exp:#ff6369;--accent:#6c8cff;--accent-t:#0e0e10;--chip:#2a2a2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px}
body{min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:14px 14px 92px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.top h1{font-size:20px;margin:0;font-weight:700}
select{background:var(--chip);color:var(--text);border:0;border-radius:10px;padding:7px 10px;font-size:15px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 6px;border-radius:10px;font-size:15px;font-weight:600}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
.bigbtn{border:0;border-radius:20px;padding:34px 8px;font-size:22px;font-weight:700;color:#fff}
.bigbtn small{display:block;font-size:14px;font-weight:500;opacity:.85;margin-top:4px}
.b-inc{background:var(--inc)}.b-exp{background:var(--exp)}
.crumb{color:var(--muted);font-size:14px;margin-bottom:10px}
.crumb b{color:var(--text)}
.amount{width:100%;border:0;background:transparent;color:var(--text);font-size:44px;font-weight:700;padding:6px 0;outline:none}
.hint{color:var(--muted);font-size:14px}
.btn{display:block;width:100%;border:0;background:var(--accent);color:var(--accent-t);padding:15px;border-radius:14px;font-size:17px;font-weight:700;margin-top:12px}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--chip);color:var(--text);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:0;background:var(--chip);color:var(--text);padding:10px 14px;border-radius:999px;font-size:15px}
.chip.on{background:var(--accent);color:var(--accent-t);font-weight:700}
input.txt{width:100%;background:var(--chip);color:var(--text);border:0;border-radius:12px;padding:12px;font-size:16px;margin-top:6px;outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:13px;color:var(--muted);margin-top:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{display:flex;width:100%;max-width:520px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 4px;font-size:12px;font-weight:600}
.tabs button span{display:block;font-size:22px;line-height:1.1}
.tabs button.on{color:var(--accent)}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month button{border:0;background:var(--chip);color:var(--text);width:38px;height:38px;border-radius:12px;font-size:18px}
.month b{font-size:17px;text-transform:capitalize}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .k{font-size:13px;color:var(--muted)}
.sum .v{font-size:21px;font-weight:700;margin-top:2px}
.pos{color:var(--inc)}.neg{color:var(--exp)}
.legend{margin-top:10px}
.lg{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.lg i{width:11px;height:11px;border-radius:50%;flex:none}
.lg .n{flex:1}.lg .p{color:var(--muted);font-size:13px;width:40px;text-align:right}
.lg .a{font-weight:600;min-width:70px;text-align:right}
.day{font-size:13px;color:var(--muted);margin:14px 4px 6px;font-weight:600}
.tx{display:flex;align-items:center;gap:10px;background:var(--card);padding:12px 14px;border-radius:14px;margin-bottom:6px}
.tx .m{flex:1;min-width:0}
.tx .c{font-weight:600}.tx .nt{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-weight:700;white-space:nowrap}
.tx .d{border:0;background:var(--chip);color:var(--muted);border-radius:10px;padding:7px 9px;font-size:13px}
.tx .d.sure{background:var(--exp);color:#fff}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:9}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
svg{max-width:100%}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs"><div id="tabs"></div></div>
<div id="toast" class="toast" style="display:none"></div>

<script>
(function(){
"use strict";
var EXP=["Еда","Транспорт","Продукты","Инвестиции","Подушка","Жильё","Здоровье","Связь","Развлечения","Одежда","Подписки","Другое"];
var INC=["Зп","Дивиденды","Подарок","Подработка","Возврат","Другое"];
var SAVINGS=["Инвестиции","Подушка"];
var COLORS=["#3b6cf6","#e5484d","#f5a524","#1f9d55","#a855f7","#06b6d4","#ec4899","#84cc16","#f97316","#64748b","#14b8a6","#eab308"];
var MON=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
var MONS=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

var txs=[], col=null, mode="local";
var tab="add";
var wiz={step:0,type:null,amount:"",cat:"",custom:"",note:"",date:todayStr()};
var view={off:0,kind:"exp"};
var cur=lsGet("cur")||"₽";
var armed=null, toastT=null;

function lsGet(k){try{return localStorage.getItem("ft_"+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem("ft_"+k,v)}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function money(n){
  var r=Math.round(n*100)/100;
  var s=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2}).format(Math.abs(r));
  return (r<0?"−":"")+s+" "+cur;
}
function toast(t){
  var el=document.getElementById("toast");el.textContent=t;el.style.display="block";
  clearTimeout(toastT);toastT=setTimeout(function(){el.style.display="none"},1800);
}

/* ---------- data layer ---------- */
function loadLocal(){
  try{txs=JSON.parse(lsGet("txs")||"[]")}catch(e){txs=[]}
}
function saveLocal(){lsSet("txs",JSON.stringify(txs))}
async function addTx(o){
  var id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  if(mode==="db"&&col){
    try{await col.doc(id).set(o);return true}catch(e){toast("Не удалось сохранить");return false}
  }
  o.id=id;txs.push(o);saveLocal();return true;
}
async function delTx(id){
  if(mode==="db"&&col){try{await col.doc(id).delete()}catch(e){toast("Не удалось удалить")}return}
  txs=txs.filter(function(t){return t.id!==id});saveLocal();render();
}
async function initData(){
  var ok=false;
  try{
    if(window.claude&&window.claude.use){
      var db=await window.claude.use("db"), user=await window.claude.use("user");
      if(db&&user){
        var uid=await user.id();
        if(uid){
          col=db.collection("data/users/"+uid);
          mode="db";ok=true;
          col.onSnapshot(function(snap){
            txs=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x})
              .filter(function(x){return typeof x.amount==="number"&&x.ts});
            if(tab!=="add")render();
          },function(){mode="local";col=null;loadLocal();render()});
        }
      }
    }
  }catch(e){ok=false}
  if(!ok){mode="local";loadLocal();if(tab!=="add")render()}
}

/* ---------- helpers ---------- */
function monthKeyOf(ts){var d=new Date(ts);return d.getFullYear()*12+d.getMonth()}
function curKey(){var n=new Date();return n.getFullYear()*12+n.getMonth()+view.off}
function inMonth(k){return txs.filter(function(t){return monthKeyOf(t.ts)===k})}
function sumBy(list,type){return list.filter(function(t){return t.type===type}).reduce(function(a,t){return a+t.amount},0)}
function customCats(type){
  var base=type==="inc"?INC:EXP, seen={}, out=[];
  txs.slice().sort(function(a,b){return b.ts-a.ts}).forEach(function(t){
    if(t.type===type&&base.indexOf(t.cat)<0&&!seen[t.cat]){seen[t.cat]=1;out.push(t.cat)}
  });
  return out.slice(0,8);
}

/* ---------- views ---------- */
function viewAdd(){
  var h='';
  if(wiz.step===0){
    h+='<div class="card"><div class="hint" style="margin-bottom:6px">Что записываем?</div>'
     +'<div class="big2"><button class="bigbtn b-inc" data-act="type" data-v="inc">Доход<small>＋</small></button>'
     +'<button class="bigbtn b-exp" data-act="type" data-v="exp">Расход<small>−</small></button></div></div>';
  }else if(wiz.step===1){
    h+='<div class="card"><div class="crumb"><b>'+(wiz.type==="inc"?"Доход":"Расход")+'</b> · сумма</div>'
     +'<input id="amt" class="amount" inputmode="decimal" placeholder="0" value="'+esc(wiz.amount)+'" autocomplete="off">'
     +'<div class="hint">'+esc(cur)+'</div>'
     +'<button class="btn" id="next" data-act="toCat">Далее</button>'
     +'<button class="btn ghost" data-act="back0">Назад</button></div>';
  }else{
    var base=wiz.type==="inc"?INC:EXP, extra=customCats(wiz.type);
    h+='<div class="card"><div class="crumb"><b>'+(wiz.type==="inc"?"Доход":"Расход")+'</b> · '+esc(money(parseFloat(wiz.amount)))+' · '+(wiz.type==="inc"?"откуда":"куда")+'</div>'
     +'<div class="chips">';
    base.concat(extra).forEach(function(c){
      h+='<button class="chip'+((!wiz.custom&&wiz.cat===c)?" on":"")+'" data-act="cat" data-v="'+esc(c)+'">'+esc(c)+'</button>';
    });
    h+='</div><div class="lbl">Или впиши свою категорию</div>'
     +'<input id="cust" class="txt" placeholder="Например: Кофе" value="'+esc(wiz.custom)+'">'
     +'<div class="row2"><div><div class="lbl">Заметка</div><input id="nt" class="txt" placeholder="необязательно" value="'+esc(wiz.note)+'"></div>'
     +'<div><div class="lbl">Дата</div><input id="dt" class="txt" type="date" value="'+esc(wiz.date)+'"></div></div>'
     +'<button class="btn" id="save" data-act="save">Сохранить</button>'
     +'<button class="btn ghost" data-act="back1">Назад</button></div>';
  }
  if(wiz.step===0){
    var n=txs.length;
    h+='<div class="note">'+(n?'Записей: '+n:'Пока пусто — добавь первую запись')+(mode==="local"?' · данные только на этом устройстве':'')+'</div>';
  }
  return h;
}

function monthHead(){
  var k=curKey(), y=Math.floor(k/12), m=k%12;
  return '<div class="month"><button data-act="prev">‹</button><b>'+MON[m]+' '+y+'</b><button data-act="next"'+(view.off>=0?' disabled style="opacity:.3"':'')+'>›</button></div>';
}

function donut(items,total){
  var R=60,C=2*Math.PI*R,off=0,s='<svg viewBox="0 0 160 160" width="170" height="170" style="display:block;margin:0 auto">';
  s+='<circle cx="80" cy="80" r="'+R+'" fill="none" stroke="var(--chip)" stroke-width="22"/>';
  items.forEach(function(it,i){
    var len=C*it.v/total;
    s+='<circle cx="80" cy="80" r="'+R+'" fill="none" stroke="'+COLORS[i%COLORS.length]+'" stroke-width="22" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 80 80)"/>';
    off+=len;
  });
  s+='<text x="80" y="76" text-anchor="middle" fill="var(--muted)" font-size="11">всего</text>';
  s+='<text x="80" y="95" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="700">'+esc(shortNum(total))+'</text></svg>';
  return s;
}
function shortNum(n){
  var a=Math.abs(n);
  if(a>=1e6)return (Math.round(n/1e5)/10)+" млн";
  if(a>=1e4)return (Math.round(n/100)/10)+" тыс";
  return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(n);
}

function bars6(){
  var k=curKey(), data=[], i, max=1;
  for(i=5;i>=0;i--){
    var kk=k-i, l=inMonth(kk);
    var inc=sumBy(l,"inc"), exp=sumBy(l,"exp");
    data.push({m:MONS[kk%12],inc:inc,exp:exp});
    max=Math.max(max,inc,exp);
  }
  var W=320,H=150,bw=16,gap=(W-6*(bw*2+4))/7,x=gap,s='<svg viewBox="0 0 '+W+' '+(H+22)+'" width="100%">';
  s+='<line x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="var(--line)"/>';
  data.forEach(function(d){
    var hi=d.inc/max*(H-8), he=d.exp/max*(H-8);
    s+='<rect x="'+x+'" y="'+(H-hi)+'" width="'+bw+'" height="'+hi+'" rx="4" fill="var(--inc)"/>';
    s+='<rect x="'+(x+bw+4)+'" y="'+(H-he)+'" width="'+bw+'" height="'+he+'" rx="4" fill="var(--exp)"/>';
    s+='<text x="'+(x+bw+2)+'" y="'+(H+15)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+d.m+'</text>';
    x+=bw*2+4+gap;
  });
  return s+'</svg>';
}

function dailyBars(list){
  var k=curKey(), y=Math.floor(k/12), m=k%12, days=new Date(y,m+1,0).getDate(), arr=[], i, max=1;
  for(i=0;i<days;i++)arr.push(0);
  list.filter(function(t){return t.type==="exp"}).forEach(function(t){var d=new Date(t.ts).getDate();arr[d-1]+=t.amount});
  arr.forEach(function(v){if(v>max)max=v});
  var W=320,H=90,bw=(W/days)-2,s='<svg viewBox="0 0 '+W+' '+(H+18)+'" width="100%">';
  s+='<line x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="var(--line)"/>';
  arr.forEach(function(v,idx){
    var h=v/max*(H-6);
    s+='<rect x="'+(idx*(W/days)+1)+'" y="'+(H-h)+'" width="'+bw+'" height="'+Math.max(h,v?2:0)+'" rx="2" fill="var(--exp)"/>';
  });
  [1,Math.ceil(days/2),days].forEach(function(d){
    s+='<text x="'+((d-1)*(W/days)+bw/2)+'" y="'+(H+14)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+d+'</text>';
  });
  return s+'</svg>';
}

function viewStats(){
  var list=inMonth(curKey()), inc=sumBy(list,"inc"), exp=sumBy(list,"exp"), bal=inc-exp;
  var saved=list.filter(function(t){return t.type==="exp"&&SAVINGS.indexOf(t.cat)>=0}).reduce(function(a,t){return a+t.amount},0);
  var h=monthHead();
  h+='<div class="card"><div class="sum">'
   +'<div><div class="k">Доходы</div><div class="v pos">'+esc(money(inc))+'</div></div>'
   +'<div><div class="k">Расходы</div><div class="v neg">'+esc(money(exp))+'</div></div>'
   +'<div><div class="k">Баланс</div><div class="v '+(bal>=0?"pos":"neg")+'">'+esc(money(bal))+'</div></div>'
   +'<div><div class="k">Из расходов отложено</div><div class="v">'+esc(money(saved))+'</div></div></div>';
  if(inc>0){
    var rate=Math.round((saved/inc)*100);
    h+='<div class="hint" style="margin-top:10px">Откладываешь '+rate+'% от дохода (инвестиции + подушка)</div>';
  }
  h+='</div>';

  h+='<div class="seg"><button data-act="kind" data-v="exp" class="'+(view.kind==="exp"?"on":"")+'">Расходы</button><button data-act="kind" data-v="inc" class="'+(view.kind==="inc"?"on":"")+'">Доходы</button></div>';
  var byCat={};
  list.filter(function(t){return t.type===view.kind}).forEach(function(t){byCat[t.cat]=(byCat[t.cat]||0)+t.amount});
  var items=Object.keys(byCat).map(function(c){return {c:c,v:byCat[c]}}).sort(function(a,b){return b.v-a.v});
  var total=items.reduce(function(a,i){return a+i.v},0);
  h+='<div class="card">';
  if(!items.length){h+='<div class="empty">Нет данных за этот месяц</div>'}
  else{
    h+=donut(items,total)+'<div class="legend">';
    items.forEach(function(it,i){
      h+='<div class="lg"><i style="background:'+COLORS[i%COLORS.length]+'"></i><span class="n">'+esc(it.c)+'</span><span class="p">'+Math.round(it.v/total*100)+'%</span><span class="a">'+esc(money(it.v))+'</span></div>';
    });
    h+='</div>';
  }
  h+='</div>';

  var days=new Date(Math.floor(curKey()/12),curKey()%12+1,0).getDate();
  var now=new Date(), isCur=view.off===0, div=isCur?now.getDate():days;
  h+='<div class="card"><div class="k hint" style="margin-bottom:6px">Расходы по дням · в среднем '+esc(money(exp/Math.max(div,1)))+' в день</div>'+dailyBars(list)+'</div>';
  h+='<div class="card"><div class="hint" style="margin-bottom:6px">Последние 6 месяцев: <span class="pos">доходы</span> / <span class="neg">расходы</span></div>'+bars6()+'</div>';
  return h;
}

function viewHist(){
  var list=txs.slice().sort(function(a,b){return b.ts-a.ts}), h='';
  h+='<div class="top" style="margin-bottom:6px"><b>История</b><button class="chip" data-act="csv">Экспорт CSV</button></div>';
  if(!list.length)return h+'<div class="empty">Пока нет записей</div>';
  var lastDay="";
  list.slice(0,300).forEach(function(t){
    var d=new Date(t.ts), ds=pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear();
    if(ds!==lastDay){h+='<div class="day">'+ds+'</div>';lastDay=ds}
    h+='<div class="tx"><div class="m"><div class="c">'+esc(t.cat)+'</div>'+(t.note?'<div class="nt">'+esc(t.note)+'</div>':'')+'</div>'
     +'<div class="s '+(t.type==="inc"?"pos":"neg")+'">'+(t.type==="inc"?"+":"−")+esc(money(t.amount))+'</div>'
     +'<button class="d'+(armed===t.id?" sure":"")+'" data-act="del" data-v="'+esc(t.id)+'">'+(armed===t.id?"Точно?":"✕")+'</button></div>';
  });
  if(list.length>300)h+='<div class="note">Показаны последние 300 записей</div>';
  return h;
}

function render(){
  var app=document.getElementById("app"), h='';
  h+='<div class="top"><h1>Мои финансы</h1><select id="cur">'
    +["₽","₸","₴","$","€","Br"].map(function(c){return '<option'+(c===cur?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div>';
  h+= tab==="add"?viewAdd():tab==="stats"?viewStats():viewHist();
  app.innerHTML=h;
  var tabs=[["add","＋","Запись"],["stats","◔","Обзор"],["hist","☰","История"]];
  document.getElementById("tabs").innerHTML=tabs.map(function(t){
    return '<button data-act="tab" data-v="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'"><span>'+t[1]+'</span>'+t[2]+'</button>';
  }).join('');
  if(tab==="add"&&wiz.step===1){var a=document.getElementById("amt");if(a){try{a.focus()}catch(e){}}}
}

/* ---------- events ---------- */
document.addEventListener("input",function(e){
  var id=e.target.id;
  if(id==="amt"){wiz.amount=e.target.value.replace(",",".")}
  else if(id==="cust"){wiz.custom=e.target.value}
  else if(id==="nt"){wiz.note=e.target.value}
  else if(id==="dt"){wiz.date=e.target.value}
});
document.addEventListener("change",function(e){
  if(e.target.id==="cur"){cur=e.target.value;lsSet("cur",cur);render()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="amt"){e.preventDefault();act("toCat")}
});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  act(b.getAttribute("data-act"),b.getAttribute("data-v"));
});

async function act(a,v){
  if(a==="tab"){tab=v;armed=null;render();return}
  if(a==="type"){wiz.type=v;wiz.step=1;wiz.cat="";wiz.custom="";render();return}
  if(a==="back0"){wiz.step=0;render();return}
  if(a==="back1"){wiz.step=1;render();return}
  if(a==="toCat"){
    var n=parseFloat(wiz.amount);
    if(!(n>0)){toast("Введи сумму");return}
    wiz.step=2;render();return;
  }
  if(a==="cat"){wiz.cat=v;wiz.custom="";
    var cu=document.getElementById("cust");if(cu)cu.value="";
    document.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c.getAttribute("data-v")===v)});return}
  if(a==="save"){
    var cat=(wiz.custom||"").trim()||wiz.cat;
    if(!cat){toast("Выбери категорию");return}
    var amount=parseFloat(wiz.amount);if(!(amount>0)){toast("Введи сумму");return}
    var d=wiz.date?new Date(wiz.date+"T12:00:00"):new Date();
    var now=new Date();
    if(wiz.date===todayStr()){d=now}
    var ok=await addTx({type:wiz.type,amount:amount,cat:cat.slice(0,40),note:(wiz.note||"").trim().slice(0,120),ts:d.getTime()});
    if(ok){
      toast("Сохранено ✓");
      wiz={step:0,type:null,amount:"",cat:"",custom:"",note:"",date:todayStr()};
      render();
    }
    return;
  }
  if(a==="prev"){view.off--;render();return}
  if(a==="next"){if(view.off<0){view.off++;render()}return}
  if(a==="kind"){view.kind=v;render();return}
  if(a==="del"){
    if(armed===v){armed=null;await delTx(v);if(mode==="db")render()}
    else{armed=v;render();setTimeout(function(){if(armed===v){armed=null;if(tab==="hist")render()}},3000)}
    return;
  }
  if(a==="csv"){
    var rows=["Дата;Тип;Категория;Сумма;Заметка"];
    txs.slice().sort(function(x,y){return x.ts-y.ts}).forEach(function(t){
      var d=new Date(t.ts), ds=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
      function q(s){return '"'+String(s||"").replace(/"/g,'""')+'"'}
      rows.push([ds,t.type==="inc"?"Доход":"Расход",q(t.cat),String(t.amount).replace(".",","),q(t.note)].join(";"));
    });
    try{
      var dl=window.claude&&window.claude.use&&await window.claude.use("downloads");
      var csv="\ufeff"+rows.join("\n");
      if(dl){await dl.save({filename:"finance.csv",data:csv})}
      else{
        var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
        var url=URL.createObjectURL(blob), a2=document.createElement("a");
        a2.href=url;a2.download="finance.csv";document.body.appendChild(a2);a2.click();
        setTimeout(function(){URL.revokeObjectURL(url);a2.remove()},1000);
      }
    }catch(err){if(!err||err.code!=="declined")toast("Не удалось экспортировать")}
  }
}

render();
initData();
})();
</script>
</body>
</html>
